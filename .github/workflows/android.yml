name: Construire l'APK

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - icon.png
      - .github/workflows/android.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le site
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Autorisations (micro pour l'appel vocal)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Icône de l'appli
        continue-on-error: true
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          os.system("rm -rf " + res + "/mipmap-anydpi-v26")
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              im = src.resize((s, s), Image.LANCZOS)
              for n in ("ic_launcher", "ic_launcher_round", "ic_launcher_foreground"):
                  im.save(f"{res}/mipmap-{d}/{n}.png")
          PY

      - name: Copier le site dans l'appli
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BeeWatsh ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
